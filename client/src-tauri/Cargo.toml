[package]
name = "server-models-client"
version = "0.1.0"
description = "SERVER MODELS 桌面控制台"
edition = "2021"

[build-dependencies]
# 版本与 @tauri-apps/cli / @tauri-apps/api 的 2.12.0 对齐，升级时需一起改
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
# tray-icon：最小化后隐藏到系统托盘，需要 tray 能力
# 图标直接复用 exe 内嵌的应用图标资源（default_window_icon），无需 image 解码 feature
tauri = { version = "=2.12.0", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.4"

# 没有这个 feature 时 tauri 会按 dev 模式编译：不内嵌 dist，改为连 http://localhost:1420
# tauri build 会自动带上它；直接 cargo build 时必须显式 --features custom-protocol
[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
